navigate_to_destination:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: tesla_fleet
    destination:
      required: true
      example: "1600 Amphitheatre Parkway, Mountain View, CA"
      selector:
        text:

navigate_to_coordinates:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: tesla_fleet
    gps:
      required: true
      example: '{"latitude": -27.9699373, "longitude": 153.4081865}'
      selector:
        location:
          radius: false
navigate_to_waypoints:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: tesla_fleet
    place_ids:
      required: true
      example: '["ChIJVTPokywQkFQRmtVEaUZlJRA", "ChIJQWCmo89rkFQRZQfQ6oJUz7o"]'
      selector:
        text:
          multiple: true

get_schedules:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: tesla_fleet

add_charge_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: tesla_fleet
    days_of_week:
      required: true
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          multiple: true
          translation_key: days_of_week
    enable:
      required: true
      default: true
      selector:
        boolean:
    location:
      required: false
      example: '{"latitude": -27.9699373, "longitude": 153.4081865}'
      selector:
        location:
          radius: false
    start_time:
      required: false
      selector:
        time:
    end_time:
      required: false
      selector:
        time:
    one_time:
      required: false
      selector:
        boolean:
    id:
      required: false
      selector:
        number:
          min: 1
          mode: box
    name:
      required: false
      selector:
        text:

remove_charge_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: tesla_fleet
    id:
      required: true
      selector:
        number:
          min: 1
          mode: box

add_precondition_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: tesla_fleet
    days_of_week:
      required: true
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          multiple: true
          translation_key: days_of_week
    enable:
      required: true
      default: true
      selector:
        boolean:
    location:
      required: false
      example: '{"latitude": -27.9699373, "longitude": 153.4081865}'
      selector:
        location:
          radius: false
    precondition_time:
      required: true
      selector:
        time:
    one_time:
      required: false
      selector:
        boolean:
    id:
      required: false
      selector:
        number:
          min: 1
          mode: box
    name:
      required: false
      selector:
        text:

remove_precondition_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: tesla_fleet
    id:
      required: true
      selector:
        number:
          min: 1
          mode: box
